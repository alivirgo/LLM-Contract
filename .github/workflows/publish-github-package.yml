name: Publish GitHub Package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out released source
        uses: actions/checkout@v7

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@alivirgo'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: npm run verify

      - name: Prepare scoped GitHub Packages mirror
        shell: bash
        run: |
          mkdir .github-package
          cp package.json README.md LICENSE llms.txt .github-package/
          cp -R dist .github-package/dist
          npm pkg set 'name=@alivirgo/llm-contract' --prefix .github-package
          npm pkg set 'publishConfig.registry=https://npm.pkg.github.com' --prefix .github-package
          npm pkg delete publishConfig.access --prefix .github-package
          npm pkg delete scripts.prepublishOnly --prefix .github-package
          npm pkg delete scripts.verify --prefix .github-package

      - name: Publish scoped mirror
        run: npm publish .github-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
