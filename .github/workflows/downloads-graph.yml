name: Update npm download graph

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-download-graph
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/update-download-graph.mjs
      - name: Commit updated graph
        shell: bash
        run: |
          if git diff --quiet -- assets/npm-downloads.svg; then
            echo "Download graph is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/npm-downloads.svg
          git commit -m "chore: update npm download graph"
          git push
